<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Sticky Board</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Sticky Board</h1>
        <p>make a note, give it a due date, and drag it along!</p>
        <div class="progress-bar-container">
            <div class="progress-text">
                <span id="progress-stats">0 tasks • 0 completed</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div class="task-controls">
            <input type="text" id="task-input" placeholder="Enter task title...">
            <input type="date" id="task-date">
            <select id="task-priority">
                <option value="low">Low Priority</option>
                <option value="high">Medium Priority</option>
                <option value="urgent">Urgent</option>
            </select>
            <button onclick="createTask()">Add Task</button>
        </div>
        <div id="container">
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Todo</h3>
                <h5>NOT STARTED YET</h5>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Doing</h3>
                <h5>IN PROGRESS</h5>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Done</h3>
                <h5>FINISHED</h5>
            </div>
        </div>
        <script src="script.js" async defer></script>
    </body>
</html>
