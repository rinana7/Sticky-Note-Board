<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Sticky Board</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Sticky Board</h1>
        <p>make a note, give it a due date, and drag it along!</p>
        <div class="progress-bar-container">
            <div class="progress-text">
                <span id="progress-stats">0 tasks • 0 completed</span>
            </div>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div class="task-controls">
            <input type="text" id="task-input" placeholder="Enter task title...">
            <input type="date" id="task-date">
            <select id="task-priority">
                <option value="low">Low Priority</option>
                <option value="high">Medium Priority</option>
                <option value="urgent">Urgent</option>
            </select>
            <button onclick="createTask()">Add Task</button>
        </div>
        <div id="photo-container-top" class="photo-card top-right-card" ondragover="allowPhotoDrop(event)" ondrop="handlePhotoDrop(event, 'top')">
            <input type="file" id="upload-top" accept="image/*" class="file-input" onchange="handlePhotoSelect(event, 'top')">
            <label for="upload-top" class="photo-wrapper">
                <img id="photo-img-top" src="default-placeholder.jpg" alt="Custom photo">
                <span class="upload-hint">Click or Drop Image</span>
            </label>
        </div>
        <div id="container">
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Todo</h3>
                <h5>NOT STARTED YET</h5>
                <div class="empty-state">
                    <p>Nothing here yet!<br>Add or drag a task here.</p>
                </div>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Doing</h3>
                <h5>IN PROGRESS</h5>
                <div class="empty-state">
                    <p>Nothing here yet!<br>Add or drag a task here.</p>
                </div>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Done</h3>
                <h5>FINISHED</h5>
                <div class="empty-state">
                    <p>Nothing here yet!<br>Add or drag a task here.</p>
                </div>
            </div>
        </div>
        <div id="task-modal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Edit Task</h3>
                    <button class="modal-close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <label for="modal-title">Title</label>
                    <input type="text" id="modal-title" placeholder="Task title...">

                    <label for="modal-description">Description</label>
                    <textarea id="modal-description" rows="4" placeholder="Add a more detailed description..."></textarea>

                    <div class="modal-row">
                        <div>
                            <label for="modal-date">Due Date</label>
                            <input type="date" id="modal-date">
                        </div>
                        <div>
                            <label for="modal-priority">Priority</label>
                            <select id="modal-priority">
                                <option value="low">Low Priority</option>
                                <option value="medium">Medium Priority</option>
                                <option value="high">High Priority</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" onclick="saveTaskDetails()">Save Changes</button>
                </div>
            </div>
        </div>
        <div id="photo-container-bottom" class="photo-card bottom-left-card" ondragover="allowPhotoDrop(event)" ondrop="handlePhotoDrop(event, 'bottom')">
            <input type="file" id="upload-bottom" accept="image/*" class="file-input" onchange="handlePhotoSelect(event, 'bottom')">
            <label for="upload-bottom" class="photo-wrapper">
                <img id="photo-img-bottom" src="default-placeholder.jpg" alt="Custom photo">
                <span class="upload-hint">Click or Drop Image</span>
            </label>
        </div>
        <script src="script.js" async defer></script>
    </body>
</html>
