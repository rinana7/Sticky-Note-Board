<!DOCTYPE <!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Sticky Board</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Sticky Board</h1>
        <p>make a note, give it a due date, and drag it along!</p>
        <div class="task-controls">
            <input type="text" id="task-input" placeholder="Enter task title...">
            <button onclick="createTask()">Add Task</button>
        </div>
        <div id="container">
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Todo</h3>
                <h5>NOT STARTED YET</h5>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Doing</h3>
                <h5>IN PROGRESS</h5>
            </div>
            <div class="board" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Done</h3>
                <h5>FINISHED</h5>
            </div>
        </div>
        <script src="script.js" async defer></script>
    </body>
</html>
